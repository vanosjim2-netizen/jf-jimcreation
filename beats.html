<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beats · jf.hobby</title>
<link rel="icon" href="logo.svg">
<script>(function(){var p=localStorage.getItem('jf-theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';})();</script>
<link rel="stylesheet" href="../jf-core/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../jf-core/core.js"></script>
<script src="lib.js"></script>
<style>
:root{--accent:#ea580c;--tint:rgba(234,88,12,.12);--cell:#e6e7eb;--cell2:#d9dbe0;--grid:#fff}
[data-theme=dark]{--accent:#fb923c;--tint:rgba(251,146,60,.15);--onacc:#2a1003;--cell:#25262b;--cell2:#2e3036;--grid:#17181b}
#app{height:100vh;display:grid;grid-template-rows:56px auto 1fr auto;overflow:hidden}
.transport{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--onacc);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px var(--accent)}
.play svg{width:20px;height:20px}
.play.on{background:var(--text);color:var(--bg)}
.grp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.grp b{color:var(--text);font-weight:600}
.num{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.tb{height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;font-size:13px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.sep{width:1px;height:28px;background:var(--line)}
input[type=range]{accent-color:var(--accent)}
.pats{display:flex;gap:4px;align-items:center}
.pat{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.pat.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.pat.playing{box-shadow:0 0 0 2px var(--accent)}
.song{display:flex;align-items:center;gap:4px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;font-size:12px;color:var(--muted)}
.song .blk{min-width:36px;height:28px;border-radius:7px;border:0;color:#fff;font-weight:700;cursor:pointer;position:relative}
.song .blk.now{outline:2px solid var(--text);outline-offset:1px}
.wrap{overflow:auto;min-height:0;padding:14px 14px 30px;background:var(--bg)}
.rows{display:flex;flex-direction:column;gap:6px;min-width:max-content}
.row{display:flex;align-items:center;gap:10px}
.th{width:230px;flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;height:44px;position:sticky;left:0;z-index:2}
.th.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.th .col{width:6px;height:28px;border-radius:3px;flex:0 0 auto}
.th .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.th .nm small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}
.ms{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:11px;font-weight:800;color:var(--muted);padding:0}
.ms.m.on{background:#ef4444;color:#fff;border-color:#ef4444}
.ms.s.on{background:#eab308;color:#111;border-color:#eab308}
.th input[type=range]{width:54px}
.th .more{border:0;background:none;width:22px;height:24px;color:var(--muted);font-size:16px;border-radius:6px}
.th .more:hover{background:var(--hover)}
.steps{display:grid;gap:4px;grid-auto-flow:column}
.st{width:34px;height:44px;border-radius:7px;border:0;background:var(--cell);padding:0;position:relative;transition:transform .06s}
.st.q{background:var(--cell2)}
.st.on{background:var(--c)}
.st.on.acc{box-shadow:inset 0 0 0 3px rgba(255,255,255,.65)}
.st.on.soft{opacity:.55}
.st.ph{outline:2px solid var(--text);outline-offset:-2px}
.st:active{transform:scale(.94)}
.st.note{background:var(--cell)}
.st.note i{position:absolute;left:3px;right:3px;border-radius:2px;background:var(--c);height:4px}
.row.dim .steps{opacity:.4}
.addrow{display:flex;gap:8px;margin-top:10px;padding-left:0}
.roll{border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;height:300px}
.roll.hidden{display:none}
.rhd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.rhd b{font-size:14px}
.rhd select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px}
.rbody{flex:1;overflow:auto;display:flex;min-height:0}
.keys{position:sticky;left:0;z-index:2;background:var(--panel);flex:0 0 auto}
.key{width:56px;height:19px;border-bottom:1px solid var(--line);font-size:9.5px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;color:var(--muted);cursor:pointer;user-select:none}
.key.blk{background:#2b2d33;color:#aaa}
[data-theme=dark] .key.blk{background:#0c0d0f}
.key.c{font-weight:700;color:var(--text)}
.key.blk.c{color:#fff}
.key:active{background:var(--accent)!important}
.pgrid{position:relative;flex:0 0 auto}
.pgrid .lane{height:19px;border-bottom:1px solid var(--line);display:flex}
.pgrid .lane.blk{background:rgba(0,0,0,.04)}
[data-theme=dark] .pgrid .lane.blk{background:rgba(0,0,0,.25)}
.pgrid .cell{width:34px;flex:0 0 auto;border-right:1px solid var(--line)}
.pgrid .cell.bar{border-right-color:var(--muted)}
.note-el{position:absolute;height:16px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);cursor:pointer;display:flex;justify-content:flex-end}
.note-el i{width:7px;cursor:ew-resize;border-radius:0 4px 4px 0;background:rgba(0,0,0,.2)}
.phl{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.6;pointer-events:none}
.knobs{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.knobs label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.knobs input{width:80px}
.kitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kitgrid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;font-size:13px}
.kitgrid button:hover{border-color:var(--accent);background:var(--tint)}
.kitgrid small{display:block;color:var(--muted);font-size:11px}
@media(max-width:700px){.th{width:150px}.th input[type=range]{display:none}.st{width:28px}}
</style>
</head>
<body>

<div id="app" class="jf-hidden">
  <div id="hdr"></div>
  <div>
    <div class="transport">
      <button class="play" id="play" title="Afspelen (spatie)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>

      <div class="grp"><span>Swing</span><input type="range" id="swing" min="0" max="60" style="width:80px"></div>
      <span class="sep"></span>
      <div class="grp"><span>Patroon</span><div class="pats" id="pats"></div></div>
      <button class="tb" id="steps" title="Aantal stappen">16 stappen</button>
      <button class="tb" id="clearPat" title="Patroon leegmaken">Leegmaken</button>
      <span class="sep"></span>
      <button class="tb" id="songBtn" title="Speel de patronen achter elkaar af">Liedje</button>
      <div class="grp"><span>Kit</span><select class="tb" id="kit"></select></div>
      <div class="spacer"></div>
      <div class="grp"><span>Volume</span><input type="range" id="master" min="0" max="100" style="width:80px"></div>
    </div>
    <div class="song hidden" id="song"></div>
  </div>
  <div class="wrap" id="wrap"><div class="rows" id="rows"></div><div class="addrow"><button class="tb" id="addDrum">+ Drumgeluid</button><button class="tb" id="addSynth">+ Instrument</button><button class="tb" id="randomBtn" title="Laat de computer een beat verzinnen">🎲 Verras me</button></div></div>
  <div class="roll hidden" id="roll"></div>
</div>
<script>

let B = null, curPat = 0, selTrack = null;

function defaultData() {

const pat = () => B.patterns[curPat];
const gridOf = (p, t) => (p.grid[t.id] = p.grid[t.id] || Array(32).fill(0));
const notesOf = (p, t) => (p.notes[t.id] = p.notes[t.id] || []);

let AC = null, master = null, noiseBuf = null, comp = null;

function setupGraph(ctx) {

function playStep(ctx, chans, p, step, t, stepDur) {

$('master').oninput = e => { B.master = +e.target.value; if (master) master.gain.value = B.master / 100; changed(); };
$('kit').onchange = e => { B.kit = e.target.value; const k = B.tracks.find(t => t.sound === 'kick'); if (k) preview(k); changed(); };
$('steps').onclick = () => { B.steps = B.steps === 16 ? 32 : 16; if (B.steps === 32) B.patterns.forEach(p => B.tracks.forEach(t => { if (t.kind === 'drum') { const g = gridOf(p, t); for (let s = 16; s < 32; s++) g[s] = g[s - 16]; } else { const ns = notesOf(p, t); if (!ns.some(n => n.s >= 16)) ns.slice().forEach(n => ns.push(Object.assign({}, n, { s: n.s + 16 }))); } })); else B.patterns.forEach(p => B.tracks.forEach(t => { if (t.kind === 'synth') p.notes[t.id] = notesOf(p, t).filter(n => n.s < 16).map(n => Object.assign(n, { l: Math.min(n.l, 16 - n.s) })); })); renderTop(); renderRows(); renderRoll(); changed(); };
$('clearPat').onclick = () => { if (!confirm('Patroon ' + String.fromCharCode(65 + curPat) + ' helemaal leegmaken?')) return; pat().grid = {}; pat().notes = {}; renderRows(); renderRoll(); changed(); };
$('songBtn').onclick = () => { B.songMode = !B.songMode; renderTop(); changed(); };
$('pats').onclick = e => {
  if (e.target.closest('#addPat')) { const c = JSON.parse(JSON.stringify(pat())); c.id = uid(); B.patterns.push(c); curPat = B.patterns.length - 1; renderTop(); renderRows(); renderRoll(); changed(); JF.toast('Patroon ' + String.fromCharCode(64 + B.patterns.length) + ' gemaakt (kopie)'); return; }
  const b = e.target.closest('[data-p]'); if (!b) return; curPat = +b.dataset.p; if (playing && !B.songMode) playPat = curPat; renderPats(); renderRows(); renderRoll();
};
$('pats').oncontextmenu = e => {
  const b = e.target.closest('[data-p]'); if (!b) return; e.preventDefault(); const i = +b.dataset.p;
  if (B.patterns.length > 1 && confirm('Patroon ' + String.fromCharCode(65 + i) + ' verwijderen?')) { B.patterns.splice(i, 1); B.song = B.song.filter(x => x !== i).map(x => x > i ? x - 1 : x); if (!B.song.length) B.song = [0]; curPat = Math.min(curPat, B.patterns.length - 1); renderTop(); renderRows(); renderRoll(); changed(); }
};
$('song').onclick = e => {
  const a = e.target.closest('[data-sa]'), b = e.target.closest('[data-sb]');
  if (a) { B.song.push(+a.dataset.sa); renderSong(); changed(); }
  if (b && B.song.length > 1) { B.song.splice(+b.dataset.sb, 1); renderSong(); changed(); }
};
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector('.modal-bg')) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? stop() : start(); }
  if (/^[1-8]$/.test(e.key) && B.patterns[+e.key - 1]) { curPat = +e.key - 1; if (playing && !B.songMode) playPat = curPat; renderPats(); renderRows(); renderRoll(); }
});

/* ---------- WAV exporteren ---------- */
async function exportWav() {
  const m = JC.modal('<h2>Exporteren naar WAV</h2><label class="field"><span>Wat wil je exporteren?</span><select class="inp" id="wx"><option value="pat">Patroon ' + String.fromCharCode(65 + curPat) + '</option>' + (B.song.length ? '<option value="song"' + (B.songMode ? ' selected' : '') + '>Het hele liedje (' + B.song.length + ' patronen)</option>' : '') + '</select></label><label class="field"><span>Hoe vaak herhalen?</span><select class="inp" id="wr"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label><div class="foot"><button class="btn sec" data-close>Annuleren</button><button class="btn" id="wgo">Exporteren</button></div>');
  m.querySelector('#wgo').onclick = async () => {
    const b = m.querySelector('#wgo'); b.disabled = true; b.textContent = 'Bezig...';
    try {
      const seq = m.querySelector('#wx').value === 'song' ? B.song.slice() : [curPat], rep = +m.querySelector('#wr').value;
      const order = []; for (let r = 0; r < rep; r++) order.push(...seq);
      const sd = stepDur(), total = order.length * B.steps * sd + 2, sr = 44100;
      const ctx = new OfflineAudioContext(2, Math.ceil(sr * total), sr); setupGraph(ctx);
      const ch = makeChans(ctx); let t = 0.05;
      order.forEach(pi => { for (let s = 0; s < B.steps; s++) { playStep(ctx, ch, B.patterns[pi], s, t + swingOff(s), sd); t += sd; } });
      const buf = await ctx.startRendering();
      JF.download(JF.safeName(JC.project.title, 'beat') + '.wav', wav(buf));
      m.close(); JF.toast('WAV gedownload');
    } catch (e) { console.error(e); b.disabled = false; b.textContent = 'Exporteren'; alert('Exporteren lukte niet.'); }
  };
}
function wav(buf) {
  const nc = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate, out = new DataView(new ArrayBuffer(44 + len * nc * 2));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); out.setUint32(4, 36 + len * nc * 2, true); ws(8, 'WAVE'); ws(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, nc, true); out.setUint32(24, sr, true); out.setUint32(28, sr * nc * 2, true); out.setUint16(32, nc * 2, true); out.setUint16(34, 16, true); ws(36, 'data'); out.setUint32(40, len * nc * 2, true);
  const chs = []; for (let c = 0; c < nc; c++) chs.push(buf.getChannelData(c));
  let o = 44; for (let i = 0; i < len; i++) for (let c = 0; c < nc; c++) { const v = Math.max(-1, Math.min(1, chs[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  return new Blob([out], { type: 'audio/wav' });
}

function changed() { JC.changed(); }
JC.getData = () => B;
JC.getThumb = () => {
  const c = document.createElement('canvas'); c.width = 320; c.height = 200; const x = c.getContext('2d');
  x.fillStyle = '#17181b'; x.fillRect(0, 0, 320, 200);
  const rows = B.tracks.slice(0, 10), rh = Math.min(18, 180 / rows.length), cw = 300 / B.steps, p = B.patterns[0];
  rows.forEach((t, r) => { for (let s = 0; s < B.steps; s++) { let on = t.kind === 'drum' ? gridOf(p, t)[s] : notesOf(p, t).some(n => s >= n.s && s < n.s + n.l); x.fillStyle = on ? t.color : '#2a2b30'; x.fillRect(10 + s * cw + 1, 10 + r * rh + 1, cw - 2, rh - 3); } });
  return c.toDataURL('image/jpeg', 0.8);
};
$('hdr').innerHTML = JC.header('beats', '<button class="btn" id="wavBtn">WAV downloaden</button>');
JC.start({
  tool: 'beats', newTitle: 'Mijn beat',
  onOpen(p) {
    B = p.data && p.data.tracks ? p.data : defaultData();
    $('wavBtn').onclick = exportWav;
    renderTop(); renderRows(); renderRoll();
    if (!p.data) { JC.changed(); JF.toast('Druk op de spatiebalk om je beat te horen'); }
  }
});
</script>

<html lang="nl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D · jf.hobby</title>
<link rel="icon" href="logo.svg">
<script>(function(){var p=localStorage.getItem('jf-theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';})();</script>

  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js",

<style>
:root{--accent:#7c3aed;--tint:rgba(124,58,237,.12)}
[data-theme=dark]{--accent:#a78bfa;--tint:rgba(167,139,250,.15);--onacc:#1d0b3d}
#app{height:100vh;display:grid;grid-template-rows:56px 46px 1fr;overflow:hidden}
.bar{display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.tb{height:32px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 9px;font-size:13px;flex:0 0 auto}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--tint);color:var(--accent)}
.tb:disabled{opacity:.4;cursor:default;background:none}
.tb svg{width:17px;height:17px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:0 0 auto}
.bar select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 6px}
.lbl{font-size:12px;color:var(--muted);margin-left:4px}
.main{display:grid;grid-template-columns:200px minmax(0,1fr) 250px;min-height:0}
.shapes{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
.shapes h3,.insp h3{font-size:12px;font-weight:700;color:var(--muted);margin:4px 0 10px;text-transform:uppercase;letter-spacing:.05em}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px}
.sg button:hover{border-color:var(--accent);background:var(--tint)}
.sg svg{width:40px;height:40px}
.view{position:relative;min-width:0;min-height:0;background:#dfe6ee}
[data-theme=dark] .view{background:#1a1d24}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.vbtns{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.vbtns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vbtns button:hover{border-color:var(--accent);color:var(--accent)}
.dims{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 10px rgba(0,0,0,.1);white-space:nowrap}
.hint{position:absolute;right:12px;bottom:14px;font-size:11.5px;color:#5a6472;text-align:right;line-height:1.5;pointer-events:none}
[data-theme=dark] .hint{color:#8a93a3}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.08);font-weight:600;pointer-events:none}
.insp{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.insp .none{color:var(--muted);font-size:13px;line-height:1.5}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg2 button{height:32px;border:0;border-radius:8px;background:none;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:650}
.seg2 i{width:14px;height:14px;border-radius:4px;display:inline-block}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.cols button{aspect-ratio:1;border-radius:8px;border:2px solid transparent;padding:0}
.cols button.on{border-color:var(--text)}
.nums{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
.nums input{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 8px;width:100%;font-variant-numeric:tabular-nums}
.nums .ax{display:flex;align-items:center;gap:6px}
.nums b{width:12px;font-size:11px}
.acts{display:flex;flex-direction:column;gap:6px}
.acts .btn{justify-content:flex-start}
@media(max-width:900px){.main{grid-template-columns:76px minmax(0,1fr) 0}.insp{display:none}.sg{grid-template-columns:1fr}.sg button span{display:none}.shapes h3{display:none}.hint{display:none}}
</style>
</head>

<div class="boot" id="boot"></div>
<div id="app" class="jf-hidden">

    <span class="sep"></span>
    <button class="tb on" data-mode="translate" title="Verplaatsen (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>Verplaatsen</button>
    <button class="tb" data-mode="rotate" title="Draaien (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/></svg>Draaien</button>
    <button class="tb" data-mode="scale" title="Schalen (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="10" height="10" rx="1"/><path d="M14 3h7v7M21 3l-8 8"/></svg>Schalen</button>
    <span class="sep"></span>
    <button class="tb" data-a="group" title="Groeperen: vormen samenvoegen en gaten uitsnijden (Ctrl+G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2" fill="currentColor" opacity=".3"/></svg>Groeperen</button>
    <button class="tb" data-a="ungroup" title="Groep opheffen (Ctrl+Shift+G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2"/></svg>Opheffen</button>
    <button class="tb" data-a="align" title="Uitlijnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 3v18"/><rect x="7" y="6" width="12" height="4" rx="1"/><rect x="7" y="14" width="7" height="4" rx="1"/></svg>Uitlijnen</button>
    <button class="tb" data-a="mirror" title="Spiegelen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v18M9 7L3 17h6zM15 7l6 10h-6z"/></svg>Spiegelen</button>
    <button class="tb" data-a="dup" title="Dupliceren (Ctrl+D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h3"/></svg></button>
    <button class="tb" data-a="del" title="Verwijderen (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <span class="sep"></span>
    <span class="lbl">Raster</span><select id="snap"><option value="0">Uit</option><option value="0.5">0,5 mm</option><option value="1" selected>1 mm</option><option value="2">2 mm</option><option value="5">5 mm</option><option value="10">10 mm</option></select>
    <span class="lbl">Werkvlak</span><select id="plate"><option value="200">200 × 200</option><option value="250">250 × 250</option><option value="150">150 × 150</option><option value="300">300 × 300</option></select>
  </div>
  <div class="main">
    <aside class="shapes"><h3>Basisvormen</h3><div class="sg" id="sg"></div></aside>
    <section class="view" id="view">
      <canvas id="cv" tabindex="0"></canvas>
      <div class="vbtns"><button data-v="home" title="Startweergave">⌂</button><button data-v="top" title="Bovenaanzicht">Boven</button><button data-v="front" title="Vooraanzicht">Voor</button><button data-v="right" title="Zijaanzicht">Zij</button><button data-v="fit" title="Alles in beeld">⤢</button></div>
      <div class="dims hidden" id="dims"></div>
      <div class="hint">Linkermuis: draaien · rechtermuis: schuiven · scrollen: zoomen<br>Sleep een vorm om hem te verplaatsen · Shift: meerdere kiezen</div>
      <div class="busy hidden" id="busy">Bezig...</div>
    </section>
    <aside class="insp" id="insp"></aside>
  </div>
</div>

    c.pos = [p.x, p.y, p.z].map(v => Math.round(v * 100) / 100); c.rot = [e.x, e.y, e.z].map(v => r1(THREE.MathUtils.radToDeg(v))); c.size = k.size.map((v, i) => r1(v * [s.x, s.y, s.z][i]));
    return c;
  });
  S.objs = S.objs.filter(o => o.id !== g.id).concat(kids); rebuild(); sel = kids.map(k => k.id); refreshSel(); commit();
}
function smallPop(anchor, html) {
  document.querySelectorAll('.cadpop').forEach(x => x.remove());
  const p = document.createElement('div'); p.className = 'cadpop'; p.style.cssText = 'position:fixed;z-index:150;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 36px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(3,auto);gap:4px';
  p.innerHTML = html; document.body.appendChild(p); const r = anchor.getBoundingClientRect(); p.style.left = Math.min(r.left, innerWidth - p.offsetWidth - 8) + 'px'; p.style.top = r.bottom + 6 + 'px';
  p.querySelectorAll('button').forEach(b => { b.className = 'tb'; b.style.border = '1px solid var(--line)'; });
  return p;
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.cadpop') && !e.target.closest('[data-a=align],[data-a=mirror]')) document.querySelectorAll('.cadpop').forEach(x => x.remove()); });
function alignPop(anchor) {
  const p = smallPop(anchor, '<button data-al="x0">← Links</button><button data-al="x1">↔ Midden</button><button data-al="x2">Rechts →</button><button data-al="z2">↑ Achter</button><button data-al="z1">Midden</button><button data-al="z0">Voor ↓</button><button data-al="y0">Onder</button><button data-al="y1">Midden</button><button data-al="y2">Boven</button>');
  p.onclick = e => {
    const b = e.target.closest('[data-al]'); if (!b) return; const ax = b.dataset.al[0], k = +b.dataset.al[1];
    const els = selObjs(), all = new THREE.Box3(); els.forEach(o => all.union(worldBox(o)));
    const i = { x: 0, y: 1, z: 2 }[ax], key = ax;
    // let op: "voor" is +z in three
    els.forEach(o => { const bb = worldBox(o); let d; const lo = all.min[key], hi = all.max[key], mid = (lo + hi) / 2;
      if (ax === 'z') { const t = k === 0 ? 'max' : k === 2 ? 'min' : 'mid'; d = t === 'max' ? hi - bb.max.z : t === 'min' ? lo - bb.min.z : mid - (bb.min.z + bb.max.z) / 2; }
      else d = k === 0 ? lo - bb.min[key] : k === 2 ? hi - bb.max[key] : mid - (bb.min[key] + bb.max[key]) / 2;
      o.pos[i] += d; updateMesh(o); });
    syncLines(); renderDims(); updInspNums(); commit();
  };
}
function mirrorPop(anchor) {
  const p = smallPop(anchor, '<button data-mi="0">↔ Links-rechts</button><button data-mi="2">↕ Voor-achter</button><button data-mi="1">⇅ Boven-onder</button>');
  p.onclick = e => {
    const b = e.target.closest('[data-mi]'); if (!b) return; const i = +b.dataset.mi;
    selObjs().forEach(o => {
      if (o.type === 'group') { o.children.forEach(k => { k.pos[i] = -k.pos[i]; if (i === 0) { k.rot[1] = -k.rot[1]; k.rot[2] = -k.rot[2]; } if (i === 1) { k.rot[0] = -k.rot[0]; k.rot[2] = -k.rot[2]; } if (i === 2) { k.rot[0] = -k.rot[0]; k.rot[1] = -k.rot[1]; } if (k.type === 'text' || k.type === 'heart' || k.type === 'wedge') k.rot[[1, 0, 1][i]] += 180; }); o.v = uid(); }
      else { if (i === 0) { o.rot[1] = -o.rot[1]; o.rot[2] = -o.rot[2]; } if (i === 1) o.rot[0] = 180 - o.rot[0]; if (i === 2) { o.rot[0] = -o.rot[0]; o.rot[1] = 180 - o.rot[1]; } }
    });
    rebuild(); commit();
  };
}

/* ---------- camera ---------- */
function setView(v) {
  const b = new THREE.Box3(); S.objs.forEach(o => b.union(worldBox(o)));
  const c = new THREE.Vector3(); let r = 120;
  if (!b.isEmpty() && (v === 'fit' || v === 'home')) { b.getCenter(c); const s = new THREE.Vector3(); b.getSize(s); r = Math.max(60, s.length() * 1.1); } else c.set(0, 0, 0);
  if (v === 'home' && b.isEmpty()) r = 230;
  const d = { home: [0.55, 0.6, 0.78], fit: [0.55, 0.6, 0.78], top: [0, 1, 0.0001], front: [0, 0.18, 1], right: [1, 0.18, 0] }[v];
  const dir = new THREE.Vector3(...d).normalize();
  orbit.target.copy(c); camera.position.copy(c).addScaledVector(dir, r * (v === 'home' && b.isEmpty() ? 1.3 : 1.4)); camera.lookAt(c); orbit.update();
}
document.querySelector('.vbtns').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };

/* ---------- toetsenbord ---------- */
document.addEventListener('keydown', e => {
  if (!S || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.querySelector('.modal-bg')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? H.redo() : H.undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); H.redo(); return; }
  if (mod && k === 'g') { e.preventDefault(); e.shiftKey ? ungroup() : group(); return; }
  if (mod && k === 'd') { e.preventDefault(); act('dup'); return; }
  if (mod && k === 'a') { e.preventDefault(); sel = S.objs.map(o => o.id); refreshSel(); return; }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); act('del'); return; }
  if (k === 'escape') { sel = []; refreshSel(); return; }
  if (k === 'w') setMode('translate'); if (k === 'e') setMode('rotate'); if (k === 'r') setMode('scale');
  if (k === 'd' && !mod) act('drop');
  if (k === 'f') setView('fit');
  if (k === 'h') { selObjs().forEach(o => o.hole = !o.hole); rebuild(); commit(); }
  if (k.startsWith('arrow') && sel.length) {
    e.preventDefault(); const st = e.shiftKey ? 10 : (snapMM || 1);
    // verplaatsen ten opzichte van de camera-richting
    const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize(); const rr = new THREE.Vector3(-f.z, 0, f.x);
    const pick = v => Math.abs(v.x) > Math.abs(v.z) ? new THREE.Vector3(Math.sign(v.x), 0, 0) : new THREE.Vector3(0, 0, Math.sign(v.z));
    let d = k === 'arrowup' ? pick(f) : k === 'arrowdown' ? pick(f).negate() : k === 'arrowright' ? pick(rr) : pick(rr).negate();
    if (mod) d = new THREE.Vector3(0, k === 'arrowup' ? 1 : k === 'arrowdown' ? -1 : 0, 0);
    selObjs().forEach(o => { o.pos[0] += d.x * st; o.pos[1] += d.y * st; o.pos[2] += d.z * st; updateMesh(o); });
    syncLines(); renderDims(); updInspNums(); clearTimeout(window._ct); window._ct = setTimeout(commit, 400);
  }
});

/* ---------- exporteren ---------- */
function exportSTL() {
  const solids = S.objs.filter(o => !o.hole); if (!solids.length) return JF.toast('Er is niets om te exporteren. Gaten tellen pas mee als je ze groepeert.');
  const g = new THREE.Group(); g.rotation.x = Math.PI / 2;
  solids.forEach(o => { const m = new THREE.Mesh(geoFor(o)); applyT(m, o); g.add(m); });
  // three.js gebruikt Y als hoogte, een slicer Z: 90 graden om X draaien
  const wrap = new THREE.Group(); wrap.add(g); wrap.updateMatrixWorld(true);
  const data = new STLExporter().parse(wrap, { binary: true });
  JF.download(JF.safeName(JC.project.title, 'model') + '.stl', new Blob([data], { type: 'model/stl' }));
  if (S.objs.some(o => o.hole)) JF.toast('Let op: losse gaten zijn niet meegenomen. Groepeer ze eerst met een vorm.'); else JF.toast('STL gedownload');
}
function exportPNG() { renderer.render(scene, camera); canvas.toBlob(b => JF.download(JF.safeName(JC.project.title, 'model') + '.png', b), 'image/png'); }

/* ---------- opslaan ---------- */
const H = JC.undo(() => S, s => { S = s; groupGeo.clear(); rebuild(); JC.changed(); });
function commit() { H.push(); JC.changed(); }
JC.getData = () => S;
JC.getThumb = () => { tcontrols.visible = false; selLines.visible = false; renderer.render(scene, camera); const t = JC.thumbFrom(canvas, '#dfe6ee'); tcontrols.visible = true; selLines.visible = true; return t; };
$('hdr').innerHTML = JC.header('cad', '<button class="icon-btn jc-hide-s" id="pngBtn">Afbeelding</button><button class="btn" id="stlBtn">STL downloaden</button>');
function startScene(data) {
  S = data && data.objs ? data : { objs: [], plate: 200, snap: 1 };
  if (S.snap != null) { snapMM = S.snap; $('snap').value = String(S.snap); }
  $('plate').value = String(S.plate || 200);
  buildPlate(S.plate || 200); resize();
  const needFont = (function walk(l) { return l.some(o => o.type === 'text' || (o.children && walk(o.children))); })(S.objs);
  const go = () => { rebuild(); H.reset(); setView('home'); applySnap(); };
  if (needFont) loadFont().then(go); else go();
  loop();
  $('stlBtn').onclick = exportSTL; $('pngBtn').onclick = exportPNG;
}
window.__cad = { s: () => S, meshes, rebuild };
JC.start({ tool: 'cad', newTitle: 'Mijn 3D-model', onOpen(p) { startScene(p.data); } });
</script>

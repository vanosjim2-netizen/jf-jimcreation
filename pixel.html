<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel · jf.hobby</title>
<link rel="icon" href="logo.svg">
<script>(function(){var p=localStorage.getItem('jf-theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';})();</script>
<link rel="stylesheet" href="../jf-core/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../jf-core/core.js"></script>
<script src="lib.js"></script>
<style>
:root{--accent:#2563eb;--tint:rgba(37,99,235,.12);--stage:#d9dce3}
[data-theme=dark]{--accent:#60a5fa;--tint:rgba(96,165,250,.15);--onacc:#06173a;--stage:#0e0f12}
#app{height:100vh;display:grid;grid-template-rows:56px 1fr 96px;overflow:hidden}
.main{display:grid;grid-template-columns:58px minmax(0,1fr) 240px;min-height:0}
.tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto}
.tools button{width:42px;height:42px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.tools button svg{width:21px;height:21px}
.tools button:hover{background:var(--hover);color:var(--text)}
.tools button.on{background:var(--tint);color:var(--accent)}
.tools hr{width:30px;border:0;border-top:1px solid var(--line);margin:4px 0}
.tools .k{position:absolute;right:3px;bottom:2px;font-size:8.5px;font-weight:700;opacity:.55}
.colors{position:relative;width:44px;height:48px;margin-top:6px}
.colors .c{position:absolute;width:28px;height:28px;border-radius:7px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.colors .c1{left:2px;top:2px;z-index:2}
.colors .c2{left:14px;top:16px}
.stage{position:relative;overflow:auto;background:var(--stage);display:flex;min-width:0;min-height:0}
.stage .inner{margin:auto;padding:40px;position:relative}
#cv{display:block;image-rendering:pixelated;background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);box-shadow:0 6px 30px rgba(0,0,0,.25);cursor:crosshair;touch-action:none}
.sinfo{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;pointer-events:none}
.side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
.side h3{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 9px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.side h3 span{flex:1}
.side section{margin-bottom:18px}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.pal button{aspect-ratio:1;border:0;border-radius:4px;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent);z-index:1}
.pal .add{background:var(--bg);color:var(--muted);font-size:16px;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.row span{flex:1}
.row input[type=range]{width:100px;accent-color:var(--accent)}
.tb{height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 9px;font-size:12.5px}
.tb:hover{border-color:var(--accent)}
.tb.on{background:var(--tint);color:var(--accent);border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prev{width:100%;aspect-ratio:1;background:repeating-conic-gradient(#d4d4d8 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.prev canvas{image-rendering:pixelated;max-width:90%;max-height:90%}
.frames{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
.fr{flex:0 0 auto;width:68px;height:68px;border-radius:9px;border:2px solid var(--line);background:repeating-conic-gradient(#e4e4e7 0 25%,#fff 0 50%) 0 0/10px 10px;padding:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fr.on{border-color:var(--accent)}
.fr canvas{image-rendering:pixelated;max-width:60px;max-height:60px}
.fr em{position:absolute;left:3px;top:2px;font-size:10px;font-style:normal;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:0 4px}
.fbtns{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--onacc);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.play svg{width:18px;height:18px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.sizes button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.sizes button small{font-weight:500;color:var(--muted);font-size:11px}
.sizes button:hover{border-color:var(--accent);background:var(--tint)}
@media(max-width:820px){.main{grid-template-columns:52px minmax(0,1fr) 0}.side{display:none}}
</style>
</head>
<body>
<div class="boot" id="boot"></div>
<div id="app" class="jf-hidden">
  <div id="hdr"></div>
  <div class="main">
    <nav class="tools" id="tools"></nav>
    <section class="stage" id="stage"><div class="inner"><canvas id="cv"></canvas></div><div class="sinfo" id="sinfo"></div></section>
    <aside class="side" id="side">
      <section><h3><span>Kleuren</span><select id="palSel" class="tb" style="height:26px;font-size:11px"></select></h3><div class="pal" id="pal"></div><div class="row" style="margin-top:10px"><span>Eigen kleur</span><input type="color" id="pick"></div></section>
      <section><h3><span>Penseel</span></h3>
        <div class="row"><span>Dikte</span><input type="range" id="brush" min="1" max="6" value="1"><b id="brushV" style="width:16px">1</b></div>
        <div class="row"><span>Spiegelen</span><button class="tb" id="mirX" title="Links en rechts tegelijk tekenen">↔</button><button class="tb" id="mirY" title="Boven en onder tegelijk tekenen">↕</button></div>
        <div class="row"><span>Vormen vullen</span><button class="tb" id="fillShapes">Uit</button></div>
      </section>
      <section><h3><span>Weergave</span></h3>
        <div class="row"><span>Raster</span><button class="tb on" id="gridBtn">Aan</button></div>
        <div class="row"><span>Uienschil</span><button class="tb" id="onionBtn" title="Laat het vorige frame doorschemeren">Uit</button></div>
        <div class="row"><span>Zoom</span><button class="tb" id="zDn">−</button><b id="zV" style="min-width:34px;text-align:center;font-size:12px"></b><button class="tb" id="zUp">+</button></div>
      </section>
      <section><h3><span>Frame</span></h3><div class="g2"><button class="tb" data-fa="flipH">↔ Spiegelen</button><button class="tb" data-fa="flipV">↕ Spiegelen</button><button class="tb" data-fa="rot">↻ Draaien</button><button class="tb" data-fa="outline">Rand eromheen</button><button class="tb" data-fa="clear">Leegmaken</button><button class="tb" data-fa="resize">Formaat</button></div></section>
      <section><h3><span>Voorbeeld</span><b id="fpsV" style="text-transform:none;font-weight:600">8 fps</b></h3><div class="prev"><canvas id="pv"></canvas></div><div class="row" style="margin-top:8px"><span>Snelheid</span><input type="range" id="fps" min="1" max="24" value="8"></div></section>
    </aside>
  </div>
  <div class="frames" id="framesBar"><button class="play" id="play" title="Animatie afspelen"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button><div style="display:flex;gap:8px" id="frames"></div><div class="fbtns"><button class="tb" id="addFr" title="Nieuw leeg frame">+ Frame</button><button class="tb" id="dupFr" title="Huidig frame kopiëren">Kopie</button></div><div class="fbtns"><button class="tb" id="delFr" title="Frame verwijderen">Verwijderen</button><div style="display:flex;gap:4px"><button class="tb" id="frL" title="Naar links">←</button><button class="tb" id="frR" title="Naar rechts">→</button></div></div></div>
</div>
<script>
'use strict';
const $ = JF.$, esc = JF.esc, uid = JF.uid;
const PALETTES = {
  pico: ['#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8', '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa'],
  endesga: ['#be4a2f', '#d77643', '#ead4aa', '#e4a672', '#b86f50', '#733e39', '#3e2731', '#a22633', '#e43b44', '#f77622', '#feae34', '#fee761', '#63c74d', '#3e8948', '#265c42', '#193c3e', '#124e89', '#0099db', '#2ce8f5', '#ffffff', '#c0cbdc', '#8b9bb4', '#5a6988', '#3a4466', '#262b44', '#181425', '#ff0044', '#68386c', '#b55088', '#f6757a', '#e8b796', '#c28569'],
  gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
  nes: ['#000000', '#fcfcfc', '#f8f8f8', '#bcbcbc', '#7c7c7c', '#a4e4fc', '#3cbcfc', '#0078f8', '#0000fc', '#b8b8f8', '#6888fc', '#0058f8', '#d8b8f8', '#9878f8', '#6844fc', '#f8b8f8', '#f878f8', '#d800cc', '#f8a4c0', '#f85898', '#e40058', '#f0d0b0', '#f87858', '#f83800', '#fce0a8', '#fca044', '#e45c10', '#f8d878', '#f8b800', '#ac7c00', '#d8f878', '#b8f818', '#00b800', '#b8f8b8', '#58d854', '#00a800', '#b8f8d8', '#58f898', '#00a844', '#00fcfc', '#00e8d8', '#008888'],
  pastel: ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff', '#fffffc', '#594f4f', '#45ada8', '#9de0ad', '#e5fcc2', '#f9a1bc', '#6a4c93', '#1982c4']
};
const PALN = { pico: 'PICO-8', endesga: 'Endesga 32', gameboy: 'Game Boy', nes: 'NES', pastel: 'Pastel', mine: 'Eigen' };
const TOOLS = [
  ['pen', 'B', 'Potlood', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>'],
  ['eraser', 'E', 'Gum', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12M5 15l9-9 5 5-8 8H8z"/></svg>'],
  ['fill', 'G', 'Emmer (Shift: zelfde kleur overal)', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15s2 2.5 2 4a2 2 0 01-4 0c0-1.5 2-4 2-4z" fill="currentColor"/></svg>'],
  ['line', 'L', 'Lijn', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19L19 5"/></svg>'],
  ['rect', 'R', 'Rechthoek', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>'],
  ['circle', 'O', 'Cirkel', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>'],
  ['pick', 'I', 'Pipet', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 4l6 6-2 2-6-6zM12 8l-8 8v4h4l8-8"/></svg>'],
  ['move', 'M', 'Verschuiven', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>'],
  ['dither', 'D', 'Ruitjespatroon', '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="8" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg>']
];
let P = null, cur = 0, tool = 'pen', c1 = '#000000', c2 = '#00000000', brush = 1, mirX = false, mirY = false, fillShapes = false, showGrid = true, onion = false, zoom = 16;
let frames = []; // canvassen
const cv = $('cv'), ctx = cv.getContext('2d');

/* ---------- frames ---------- */
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function loadFrames() {
  return Promise.all(P.frames.map(src => new Promise(res => { const c = newCanvas(P.w, P.h); if (!src) return res(c); const i = new Image(); i.onload = () => { c.getContext('2d').drawImage(i, 0, 0); res(c); }; i.onerror = () => res(c); i.src = src; }))).then(l => { frames = l; });
}
const F = () => frames[cur];
const FX = () => F().getContext('2d', { willReadFrequently: true });
function saveFrame(i) { P.frames[i == null ? cur : i] = frames[i == null ? cur : i].toDataURL('image/png'); }
const H = JC.undo(() => P, s => { P = s; cur = Math.min(cur, P.frames.length - 1); loadFrames().then(() => { draw(); renderFrames(); }); JC.changed(); });
function commit() { saveFrame(); H.push(); JC.changed(); renderFrames(); }

/* ---------- tekenen op het scherm ---------- */
function setZoom(z) { zoom = Math.max(1, Math.min(64, z)); cv.width = P.w * zoom; cv.height = P.h * zoom; cv.style.backgroundSize = Math.max(8, zoom * 2) + 'px ' + Math.max(8, zoom * 2) + 'px'; cv.style.backgroundPosition = '0 0,' + Math.max(4, zoom) + 'px ' + Math.max(4, zoom) + 'px'; $('zV').textContent = zoom + 'x'; draw(); }
function fitZoom() { const s = $('stage'); setZoom(Math.max(1, Math.floor(Math.min((s.clientWidth - 80) / P.w, (s.clientHeight - 80) / P.h)))); }
let preview = null, hover = null;
function draw() {
  ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, cv.width, cv.height);
  if (onion && cur > 0) { ctx.globalAlpha = 0.28; ctx.drawImage(frames[cur - 1], 0, 0, cv.width, cv.height); ctx.globalAlpha = 1; }
  ctx.drawImage(preview || F(), 0, 0, cv.width, cv.height);
  if (showGrid && zoom >= 6) {
    ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 1; x < P.w; x++) { ctx.moveTo(x * zoom + 0.5, 0); ctx.lineTo(x * zoom + 0.5, cv.height); }
    for (let y = 1; y < P.h; y++) { ctx.moveTo(0, y * zoom + 0.5); ctx.lineTo(cv.width, y * zoom + 0.5); }
    ctx.stroke();
    if (P.w >= 16) { ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); const st = P.w >= 64 ? 16 : 8; for (let x = st; x < P.w; x += st) { ctx.moveTo(x * zoom + 0.5, 0); ctx.lineTo(x * zoom + 0.5, cv.height); } for (let y = st; y < P.h; y += st) { ctx.moveTo(0, y * zoom + 0.5); ctx.lineTo(cv.width, y * zoom + 0.5); } ctx.stroke(); }
  }
  if (mirX) { ctx.strokeStyle = 'rgba(37,99,235,.7)'; ctx.beginPath(); ctx.moveTo(cv.width / 2, 0); ctx.lineTo(cv.width / 2, cv.height); ctx.stroke(); }
  if (mirY) { ctx.strokeStyle = 'rgba(37,99,235,.7)'; ctx.beginPath(); ctx.moveTo(0, cv.height / 2); ctx.lineTo(cv.width, cv.height / 2); ctx.stroke(); }
  if (hover && !drag && ['pen', 'eraser', 'dither'].includes(tool)) { ctx.strokeStyle = 'rgba(37,99,235,.9)'; ctx.lineWidth = 1.5; const o = Math.floor((brush - 1) / 2); ctx.strokeRect((hover.x - o) * zoom + 0.75, (hover.y - o) * zoom + 0.75, brush * zoom - 1.5, brush * zoom - 1.5); }
  $('sinfo').textContent = P.w + ' × ' + P.h + (hover ? ' · ' + hover.x + ', ' + hover.y : '') + ' · frame ' + (cur + 1) + '/' + frames.length;
}

/* ---------- pixels ---------- */
function hexToRGBA(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) : 255]; }
const rgbaHex = (r, g, b, a) => a < 128 ? '#00000000' : '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
let img = null; // ImageData tijdens tekenen
function plot(x, y, col, pat) {
  const pts = [[x, y]]; if (mirX) pts.push([P.w - 1 - x, y]); if (mirY) pts.push([x, P.h - 1 - y]); if (mirX && mirY) pts.push([P.w - 1 - x, P.h - 1 - y]);
  const o = Math.floor((brush - 1) / 2);
  pts.forEach(([px, py]) => { for (let dy = 0; dy < brush; dy++) for (let dx = 0; dx < brush; dx++) { const X = px - o + dx, Y = py - o + dy; if (X < 0 || Y < 0 || X >= P.w || Y >= P.h) continue; if (pat && (X + Y) % 2) continue; const i = (Y * P.w + X) * 4; img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = col[3]; } });
}
function line(x0, y0, x1, y1, fn) { const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (;;) { fn(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }
function rectPts(x0, y0, x1, y1, filled, fn) { const a = Math.min(x0, x1), b = Math.max(x0, x1), c = Math.min(y0, y1), d = Math.max(y0, y1); for (let y = c; y <= d; y++) for (let x = a; x <= b; x++) if (filled || x === a || x === b || y === c || y === d) fn(x, y); }
function ellipsePts(x0, y0, x1, y1, filled, fn) {
  const a = Math.min(x0, x1), b = Math.max(x0, x1), c = Math.min(y0, y1), d = Math.max(y0, y1), cx = (a + b) / 2, cy = (c + d) / 2, rx = (b - a) / 2 + 0.5, ry = (d - c) / 2 + 0.5;
  const inside = (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
  for (let y = c; y <= d; y++) for (let x = a; x <= b; x++) { if (!inside(x, y)) continue; if (filled || !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1)) fn(x, y); }
}
function floodFill(x, y, col, global) {
  const d = img.data, W = P.w, Hh = P.h, i0 = (y * W + x) * 4, t = [d[i0], d[i0 + 1], d[i0 + 2], d[i0 + 3]];
  const same = i => d[i + 3] === 0 && t[3] === 0 ? true : d[i] === t[0] && d[i + 1] === t[1] && d[i + 2] === t[2] && d[i + 3] === t[3];
  if (t.every((v, k) => v === col[k])) return;
  if (global) { for (let i = 0; i < d.length; i += 4) if (same(i)) { d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3]; } return; }
  const st = [[x, y]], seen = new Uint8Array(W * Hh);
  while (st.length) { const [px, py] = st.pop(); if (px < 0 || py < 0 || px >= W || py >= Hh) continue; const k = py * W + px; if (seen[k]) continue; seen[k] = 1; const i = k * 4; if (!same(i)) continue; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3]; st.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]); }
}

/* ---------- muis ---------- */
let drag = null;
function cell(e) { const r = cv.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / r.width * P.w), y: Math.floor((e.clientY - r.top) / r.height * P.h) }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (playing) togglePlay();
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const p = cell(e), right = e.button === 2, col = hexToRGBA(tool === 'eraser' ? '#00000000' : right ? c2 : c1);
  img = FX().getImageData(0, 0, P.w, P.h);

JC.getData = () => P;
JC.getThumb = () => { const c = newCanvas(P.w, P.h); c.getContext('2d').drawImage(frames[0], 0, 0); const s = Math.max(1, Math.floor(200 / Math.max(P.w, P.h))); const t = newCanvas(Math.round(320), 200), x = t.getContext('2d'); x.fillStyle = '#e8ebf2'; x.fillRect(0, 0, 320, 200); x.imageSmoothingEnabled = false; const dw = P.w * s, dh = P.h * s; x.drawImage(c, (320 - dw) / 2, (200 - dh) / 2, dw, dh); return t.toDataURL('image/png'); };
$('hdr').innerHTML = JC.header('pixel', '<button class="btn" id="expBtn">Downloaden</button>');
JC.start({
  tool: 'pixel', newTitle: 'Mijn sprite',
  onOpen(p) { $('expBtn').onclick = exportModal; renderTools(); if (p.data && p.data.frames) { P = p.data; boot(); } else sizeModal(); }
});
</script>
